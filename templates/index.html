<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental HUB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/icon type">

</head>
<body>
<div id="main-area">
    <div id="logo-container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Chatbot Logo" id="logo">
    </div>
    <div id="chat-container">
        <div id="chat-box">
            <!-- Chat messages will appear here -->
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your message here...">
            <button id="send-btn">Send</button>
        </div>
    </div>
    <div id="contributor">by Hien Bui, Luc Vu, Dung Nguyen</div>

</div>
<script>
    const sendButton = document.getElementById('send-btn');
    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');

    var isBusy = true;


    function addMessageToChat(sender, message) {
        const messageContainer = document.createElement('div');
        messageContainer.className = sender;
        let messageElement = document.createElement('div');
        messageElement.className = 'message';

        if (sender === "You"){

            messageElement.innerHTML = message;

            messageContainer.appendChild(messageElement);
            chatBox.appendChild(messageContainer);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        else if (sender === "Bot"){

            messageContainer.appendChild(messageElement);
            chatBox.appendChild(messageContainer);
            index = 0;

            const typingEffect = setInterval(() => {

                messageElement.innerHTML += message.charAt(index);

                index++;
                chatBox.scrollTop = chatBox.scrollHeight;
                if (index === message.length) {
                    clearInterval(typingEffect);
                    isBusy = false;
                    sendButton.className = 'default'
                }
            }, 30); // Adjust typing speed here (50ms per character)
        }
    }

    fetch('/greeting', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    }).then(response => response.json())
        .then(data => addMessageToChat('Bot', data.reply));

    function sendMessage() {
        const message = userInput.value.trim();
        if (message && (isBusy === false)) {
            addMessageToChat('You', userInput.value);
            userInput.value = '';
            isBusy = true;
            sendButton.className = 'disabled'

            // Show "typing" indicator
            const typingContainer = document.createElement('div');
            typingContainer.className = 'Bot';
            const typingIndicator = document.createElement('div');
            typingIndicator.id = 'typing-indicator';
            typingIndicator.className = 'ticontainer';
            typingIndicator.innerHTML = `
              <div class="tiblock">
                <div class="tidot"></div>
                <div class="tidot"></div>
                <div class="tidot"></div>
              </div>
            `;
            typingContainer.appendChild(typingIndicator);
            chatBox.appendChild(typingContainer);
            chatBox.scrollTop = chatBox.scrollHeight;


            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message }),
            })
                .then(response => response.json())
                .then(data => {
                    typingContainer.remove();
                    console.log(data.reply);
                    addMessageToChat('Bot', data.reply);
                })
                .catch(() => {
                    // Handle errors and remove "typing" indicator
                    typingContainer.remove();
                    addMessageToChat('Bot', 'Sorry, there was an error. Please try again.');
                });
        }
    }
    userInput.addEventListener('keypress', (event) => {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });

    sendButton.addEventListener('click', ()=>{
        sendMessage();

    });

</script>
</body>
<footer>
</footer>
</html>
